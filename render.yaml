services:
  - type: web
    name: cricket-fantasy
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      # Neon Postgres connection string (postgresql://...?sslmode=require), set in the Render dashboard.
      # Replaces the SQLite file, which is wiped on every restart/redeploy.
      - key: DATABASE_URL
        sync: false
      # Admin account created on first start; Render asks for these values when the Blueprint is applied.
      - key: ADMIN_MOBILE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO_DATA
        value: "false"
